kind = "web"
previewPath = "/"
title = "KanDelta"
description = "Opportunity intelligence for the video internet. Find the delta before the market does."
version = "1.0.0"
id = "artifacts/whitespace"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18253

[services.development]
run = "npm --prefix ../.. run start -- -H 0.0.0.0 -p ${PORT:-18253}"

[services.production]

[services.production.build]
args = [ "sh", "-c", "cd ../.. && npm ci && npm run build" ]

[services.production.run]
args = [ "sh", "-c", "cd ../.. && npm run start -- -H 0.0.0.0 -p ${PORT:-18253}" ]

[services.env]
PORT = "18253"
BASE_PATH = "/"