kind = "web"
previewPath = "/"
title = "KanDelta"
description = "Deployment wrapper for the canonical root Next.js application."
version = "1.0.0"
id = "artifacts/kandelta"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21265

[services.development]
run = "npm --prefix ../.. run start -- -H 0.0.0.0 -p ${PORT:-21265}"

[services.production]

[services.production.build]
args = [ "sh", "-c", "npm ci && npm run build" ]

[services.production.run]
args = [ "sh", "-c", "npm run start -- -H 0.0.0.0 -p $PORT" ]

[services.env]
PORT = "21265"
BASE_PATH = "/"